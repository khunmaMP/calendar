<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2A2522;
    --sub: #8F867C;
    --line: #D6CFC4;
    --linen: #ECE6DD;
    --bg: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); overflow: hidden; }
  body {
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 4px 2px;
  }
  .cal { width: 100%; max-width: 260px; min-width: 0; }
  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 1px 8px; gap: 4px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 8px;
  }
  .month { font-family: "DM Serif Display", Georgia, serif; font-size: clamp(14px, 11.5vw, 18px); line-height: 1.1; }
  .year { font-size: clamp(8px, 6vw, 10px); color: var(--sub); letter-spacing: .06em; margin-left: 5px; }
  .nav { display: flex; gap: 0; flex-shrink: 0; }
  .nav button {
    border: 0; background: none; cursor: pointer;
    color: var(--sub); font-size: 13px; width: 16px; height: 18px; border-radius: 50%; padding: 0;
  }
  .nav button:hover { background: var(--linen); color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; text-align: center; }
  .dow { font-size: 8.5px; font-weight: 600; letter-spacing: .08em; color: var(--sub); padding-bottom: 4px; }
  .day {
    font-size: 11px; line-height: 22px; height: 22px; width: 22px; max-width: 100%;
    margin: 0 auto; border-radius: 50%; font-variant-numeric: tabular-nums;
  }
  .day.out { color: var(--line); }
  .day.wknd { color: var(--sub); }
  .day.today { background: var(--ink); color: #fff; font-weight: 600; }
  .foot {
    margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--line);
    font-size: 10.5px; color: var(--sub); text-align: center; letter-spacing: .02em;
  }
  .foot b { color: var(--ink); font-weight: 500; }
  .clk { display: none; margin-top: 10px; padding: 10px 0 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; }
  .clk .time { font-family: "DM Serif Display", Georgia, serif; font-size: clamp(30px, 24vw, 38px); line-height: 1; font-variant-numeric: tabular-nums; }
  .clk .colon { display: inline-block; margin: 0 1px; transform: translateY(-3px); color: var(--sub); }
  .clk .ampm { font-family: "Inter", sans-serif; font-size: 10px; color: var(--sub); letter-spacing: .08em; margin-left: 4px; }
  .with-clock .clk { display: block; }
  .with-clock .foot { border-bottom: 0; }
  .tmr { display: none; margin-top: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); text-align: center; }
  .with-timer .tmr { display: block; }
  .with-timer.with-clock .clk { border-bottom: 0; padding-bottom: 2px; }
  .tmr .modes { display: flex; justify-content: center; gap: 12px; margin-bottom: 6px; }
  .tmr .modes button, .tmr .ctl button {
    border: 0; background: none; cursor: pointer; font-family: "Inter", sans-serif;
    font-size: 8.5px; font-weight: 600; letter-spacing: .1em; color: var(--sub); padding: 2px 0;
  }
  .tmr .modes button.on { color: var(--ink); border-bottom: 1px solid var(--ink); }
  .tmr .left { font-family: "DM Serif Display", Georgia, serif; font-size: clamp(17px, 13vw, 21px); line-height: 1; font-variant-numeric: tabular-nums; }
  .tmr .bar { height: 2px; background: var(--linen); margin: 8px 14% 7px; border-radius: 2px; overflow: hidden; }
  .tmr .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .5s linear; }
  .tmr .ctl { display: flex; justify-content: center; gap: 14px; }
  .tmr .ctl button { font-size: 9.5px; letter-spacing: .06em; color: var(--ink); padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; }
  .tmr .ctl button.ghost { border-color: transparent; color: var(--sub); }
  .tmr .count { margin-top: 6px; font-size: 9px; color: var(--sub); letter-spacing: .03em; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #EDE7DF; --sub: #9A9187; --line: #4A443F; --linen: #34302C; --bg: #191919; }
    .day.today { color: #191919; }
  }
</style>
</head>
<body>
<div class="cal">
  <div class="head">
    <div><span class="month" id="m"></span><span class="year" id="y"></span></div>
    <div class="nav">
      <button id="prev" aria-label="Previous month">&#8249;</button>
      <button id="next" aria-label="Next month">&#8250;</button>
    </div>
  </div>
  <div class="grid" id="g"></div>
  <div class="foot" id="f"></div>
  <div class="clk"><div class="time" id="t"></div></div>
  <div class="tmr">
    <div class="modes">
      <button data-min="25" class="on">FOCUS 25</button>
      <button data-min="5">BREAK 5</button>
    </div>
    <div class="left" id="left">25:00</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="ctl">
      <button id="go">Start</button>
      <button id="rs" class="ghost">Reset</button>
    </div>
    <div class="count" id="count">0 focus sessions today</div>
  </div>
</div>
<script>
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const today = new Date();
  let view = new Date(today.getFullYear(), today.getMonth(), 1);

  function render() {
    const y = view.getFullYear(), mo = view.getMonth();
    document.getElementById("m").textContent = MONTHS[mo];
    document.getElementById("y").textContent = y;
    const g = document.getElementById("g");
    g.innerHTML = DOW.map(d => `<div class="dow">${d.toUpperCase().slice(0,2)}</div>`).join("");
    const first = (new Date(y, mo, 1).getDay() + 6) % 7;      // Monday-first offset
    const days = new Date(y, mo + 1, 0).getDate();
    const prevDays = new Date(y, mo, 0).getDate();
    const cells = Math.ceil((first + days) / 7) * 7;
    let html = "";
    for (let i = 0; i < cells; i++) {
      const col = i % 7;
      let n, cls = "day";
      if (i < first) { n = prevDays - first + i + 1; cls += " out"; }
      else if (i >= first + days) { n = i - first - days + 1; cls += " out"; }
      else {
        n = i - first + 1;
        if (col >= 5) cls += " wknd";
        if (y === today.getFullYear() && mo === today.getMonth() && n === today.getDate()) cls += " today";
      }
      html += `<div class="${cls}">${n}</div>`;
    }
    g.insertAdjacentHTML("beforeend", html);
    const wd = today.toLocaleDateString("en-US", { weekday: "long" });
    document.getElementById("f").innerHTML =
      `<b>${wd}</b> · ${today.getDate()} ${MONTHS[today.getMonth()].slice(0,3)}`;
  }
  document.getElementById("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
  document.getElementById("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
  render();
  // ?clock=1 adds a digital clock under the calendar; &h=12 for 12-hour time
  const qs = new URLSearchParams(location.search);
  if (qs.get("clock") === "1") {
    document.querySelector(".cal").classList.add("with-clock");
    const h12 = qs.get("h") === "12";
    const tick = () => {
      const d = new Date(); let h = d.getHours(), ap = "";
      if (h12) { ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; }
      const hh = h12 ? String(h) : String(h).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      document.getElementById("t").innerHTML = `${hh}<span class="colon">:</span>${mm}` + (ap ? `<span class="ampm">${ap}</span>` : "");
    };
    tick();
    setTimeout(() => { tick(); setInterval(tick, 60000); }, (60 - new Date().getSeconds()) * 1000 + 50);
  }
  // ?timer=1 adds a focus (Pomodoro) timer: 25 min focus / 5 min break
  let running = false;
  if (qs.get("timer") === "1") {
    document.querySelector(".cal").classList.add("with-timer");
    const left = document.getElementById("left"), bar = document.getElementById("bar");
    const go = document.getElementById("go"), rs = document.getElementById("rs");
    const cnt = document.getElementById("count");
    const key = "p32-focus-" + today.toDateString();
    let done = 0; try { done = +localStorage.getItem(key) || 0; } catch (e) {}
    const showCount = () => cnt.textContent = done + (done === 1 ? " focus session" : " focus sessions") + " today";
    showCount();
    let mins = 25, total = mins * 60, rest = total, endAt = 0, iv = null;
    const draw = () => {
      left.textContent = String(Math.floor(rest / 60)).padStart(2, "0") + ":" + String(rest % 60).padStart(2, "0");
      bar.style.width = (100 * (total - rest) / total) + "%";
    };
    const stop = () => { running = false; clearInterval(iv); go.textContent = rest < total ? "Resume" : "Start"; };
    const finish = () => {
      stop(); rest = 0; draw();
      if (mins === 25) { done++; try { localStorage.setItem(key, done); } catch (e) {} showCount(); }
      go.textContent = "Start"; rest = total;
      try { new AudioContext().resume().then(function () { const c = new AudioContext(), o = c.createOscillator(); o.frequency.value = 660; o.connect(c.destination); o.start(); o.stop(c.currentTime + .4); }); } catch (e) {}
      setTimeout(draw, 1500);
    };
    go.onclick = () => {
      if (running) { stop(); return; }
      running = true; go.textContent = "Pause"; endAt = Date.now() + rest * 1000;
      iv = setInterval(() => { rest = Math.max(0, Math.round((endAt - Date.now()) / 1000)); draw(); if (rest === 0) finish(); }, 250);
    };
    rs.onclick = () => { stop(); rest = total; go.textContent = "Start"; draw(); };
    document.querySelectorAll(".modes button").forEach(b => b.onclick = () => {
      document.querySelectorAll(".modes button").forEach(x => x.classList.remove("on"));
      b.classList.add("on"); stop(); mins = +b.dataset.min; total = rest = mins * 60; go.textContent = "Start"; draw();
    });
    draw();
  }
  // refresh at midnight so an open page rolls over to the new day (not mid-session)
  setInterval(() => {
    const now = new Date();
    if (now.getDate() !== today.getDate() && !running) location.reload();
  }, 60000);
</script>
</body>
</html>
